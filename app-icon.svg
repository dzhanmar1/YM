<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep black background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>

    <!-- Crimson accent gradient matching --accent-crimson: #a3021a -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c40422"/>
      <stop offset="100%" stop-color="#7a0115"/>
    </linearGradient>

    <!-- Subtle rim light on squircle border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Crimson glow filter -->
    <filter id="crimsonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feFlood flood-color="#a3021a" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft ambient glow -->
    <filter id="ambientGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="80" result="blur"/>
    </filter>
  </defs>

  <!-- Base squircle — deep dark -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"
        fill="url(#bgGrad)"/>

  <!-- Rim border -->
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="229" ry="229"
        fill="none"
        stroke="url(#rimGrad)"
        stroke-width="2.5"/>

  <!-- Subtle crimson ambient glow behind bars -->
  <rect x="312" y="400" width="400" height="300" rx="8"
        fill="#a3021a" opacity="0.18" filter="url(#ambientGlow)"/>

  <!-- === SOUNDWAVE BARS — 7 bars, symmetric, crimson === -->
  <!-- Heights: 160 220 320 420 320 220 160 — tallest in center -->
  <!-- All bars: width 54px, gap 20px, total span: 7*54+6*20=378+120=498px, start x=263 -->

  <!-- Bar 1 (leftmost, shortest) -->
  <rect x="263" y="432" width="54" height="160" rx="27"
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)" opacity="0.9"/>

  <!-- Bar 2 -->
  <rect x="337" y="402" width="54" height="220" rx="27"
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)"/>

  <!-- Bar 3 -->
  <rect x="411" y="352" width="54" height="320" rx="27"
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)"/>

  <!-- Bar 4 (center, tallest) -->
  <rect x="485" y="302" width="54" height="420" rx="27"
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)"/>

  <!-- Bar 5 -->
  <rect x="559" y="352" width="54" height="320" rx="27"
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)"/>

  <!-- Bar 6 -->
  <rect x="633" y="402" width="54" height="220" rx="27"
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)"/>

  <!-- Bar 7 (rightmost, shortest) -->
  <rect x="707" y="432" width="54" height="160" rx="27"
        fill="url(#crimsonGrad)" filter="url(#crimsonGlow)" opacity="0.9"/>

  <!-- White specular highlight dots on top of each bar (adds depth) -->
  <circle cx="290" cy="450" r="11" fill="#ffffff" opacity="0.22"/>
  <circle cx="364" cy="420" r="11" fill="#ffffff" opacity="0.22"/>
  <circle cx="438" cy="368" r="11" fill="#ffffff" opacity="0.22"/>
  <circle cx="512" cy="318" r="13" fill="#ffffff" opacity="0.28"/>
  <circle cx="586" cy="368" r="11" fill="#ffffff" opacity="0.22"/>
  <circle cx="660" cy="420" r="11" fill="#ffffff" opacity="0.22"/>
  <circle cx="734" cy="450" r="11" fill="#ffffff" opacity="0.22"/>
</svg>
