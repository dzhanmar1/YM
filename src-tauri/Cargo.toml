[package]
name = "ym-desktop-core"
version = "0.1.0"
description = "YM Desktop — Minimalist Yandex Music Desktop Client"
authors = ["dzhan"]
edition = "2021"

[lib]
name = "ym_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"

# Yandex Music API client
yandex-music = "0.7.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime & HTTP streaming proxy
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# SQLite database for token and metadata caching
rusqlite = { version = "0.31", features = ["bundled"] }
md5 = "0.7"

# HTTP client for proxy & file downloads (rustls-tls for seamless Android cross-compilation)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

# Error handling and utilities
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
parking_lot = "0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[profile.dev]
incremental = true

[profile.release]
opt-level     = 3        # Максимальная скорость выполнения
lto           = "thin"   # Link-Time Optimization (thin — хороший баланс скорости сборки и размера)
codegen-units = 1        # Максимальные возможности оптимизатора
incremental   = false
strip         = "symbols"  # Удаляем debug-символы из финального бинарника
panic         = "abort"    # abort вместо unwinding — меньше размер, чуть быстрее

[profile.release.build-override]
codegen-units = 1
incremental = false



